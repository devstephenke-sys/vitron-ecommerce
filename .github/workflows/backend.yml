name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitron
          POSTGRES_PASSWORD: vitron
          POSTGRES_DB: vitron
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitron -d vitron"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://vitron:vitron@localhost:5432/vitron
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q

      - name: Apply database migrations
        run: uv run alembic upgrade head
